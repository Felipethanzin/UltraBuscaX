<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UltraBuscaX | Speed Test</title>

<style>

/* =========================================================
RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    background:
    radial-gradient(circle at top left,rgba(0,102,255,0.15),transparent 30%),
    radial-gradient(circle at bottom right,rgba(0,255,170,0.07),transparent 30%),
    #020611;

    color:#fff;

    min-height:100vh;

    overflow-x:hidden;
}

/* GRID FUNDO */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

    background-size:45px 45px;

    z-index:-1;
}

/* =========================================================
HEADER
========================================================= */

.header{

    width:100%;

    padding:22px 8%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(16px);

    background:rgba(0,0,0,0.2);

    position:sticky;
    top:0;

    z-index:999;
}

/* LOGO */

.logo{

    display:flex;
    align-items:center;
    gap:14px;
}

.logo img{

    width:40px;

    filter:invert(1);
}

.logo span{

    font-size:1.6rem;
    font-weight:800;

    background:linear-gradient(90deg,#fff,#4da3ff);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* MENU */

.menu{

    display:flex;
    align-items:center;
    gap:14px;
}

.menu a{

    color:rgba(255,255,255,0.75);

    text-decoration:none;

    padding:12px 18px;

    border-radius:12px;

    transition:0.3s;
}

.menu a:hover{

    background:rgba(255,255,255,0.05);

    color:#4da3ff;
}

/* =========================================================
MAIN
========================================================= */

.main-grid{

    width:100%;

    min-height:calc(100vh - 90px);

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:60px;

    padding:70px 8%;
}

/* =========================================================
HERO
========================================================= */

.hero{

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.tag{

    width:max-content;

    padding:10px 18px;

    border-radius:999px;

    background:rgba(77,163,255,0.12);

    border:1px solid rgba(77,163,255,0.2);

    color:#6eb7ff;

    margin-bottom:30px;
}

.hero h1{

    font-size:4.2rem;

    line-height:1.05;

    margin-bottom:25px;
}

.hero p{

    color:#9fb2cc;

    font-size:1.1rem;

    line-height:1.9;

    max-width:580px;
}

/* IMAGE */

.hero img{

    width:100%;
    max-width:450px;

    margin-top:40px;

    animation:float 4s ease-in-out infinite;

    filter:
    drop-shadow(0 25px 60px rgba(0,0,0,0.5));
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-14px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* =========================================================
FORM
========================================================= */

.form{

    background:rgba(255,255,255,0.03);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border-radius:30px;

    overflow:hidden;

    box-shadow:
    0 30px 80px rgba(0,0,0,0.45);
}

/* TOP */

.form-top{

    padding:28px 30px;

    border-bottom:1px solid rgba(255,255,255,0.06);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.form-top h2{

    font-size:1.8rem;
}

.live{

    padding:8px 14px;

    border-radius:999px;

    background:rgba(0,255,170,0.12);

    color:#00ffae;

    font-size:0.85rem;

    font-weight:700;
}

/* IFRAME */

.speed-frame{

    width:100%;
    height:700px;

    border:none;

    background:#000;
}

/* =========================================================
RESPONSIVO
========================================================= */

@media(max-width:1100px){

    .main-grid{

        grid-template-columns:1fr;
    }

    .hero{

        text-align:center;
        align-items:center;
    }

    .hero p{
        max-width:100%;
    }

}

@media(max-width:700px){

    .header{

        flex-direction:column;

        gap:20px;
    }

    .menu{

        flex-wrap:wrap;
        justify-content:center;
    }

    .hero h1{

        font-size:2.8rem;
    }

    .main-grid{

        padding:50px 5%;
    }

    .speed-frame{

        height:650px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="logo">

        <img src="https://cdn-icons-png.flaticon.com/512/906/906175.png">

        <span>UltraBuscaX</span>

    </div>

    <nav class="menu">

        <a href="../home/home.html">Home</a>
        <a href="#">Ferramentas</a>
        <a href="#">OSINT</a>
        <a href="#">Suporte</a>

    </nav>

</header>

<!-- MAIN -->

<main class="main-grid">

    <!-- HERO -->

    <div class="hero">

        <div class="tag">
            ⚡ SPEED TEST REAL
        </div>

        <h1>
            Teste sua internet em tempo real
        </h1>

        <p>
            Analise download, upload, ping,
            latência e estabilidade da sua conexão
            utilizando um sistema profissional
            de velocidade online.
        </p>

        <img src="https://cdn-icons-png.flaticon.com/512/4149/4149676.png">

    </div>

    <!-- FORM -->

    <div class="form">

        <div class="form-top">

            <h2>Teste Profissional</h2>

            <div class="live">
                ● AO VIVO
            </div>

        </div>

        <!-- SPEEDTEST REAL -->

        <iframe
        class="speed-frame"
        src="https://www.speedtest.net/pt">
        </iframe>

    </div>

</main>

</body>

</html>
