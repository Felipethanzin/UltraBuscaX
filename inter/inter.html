<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UltraBuscaX | Speed Test</title>

<style>

/* =========================================================
RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    background:
    radial-gradient(circle at top left,rgba(0,102,255,0.15),transparent 30%),
    radial-gradient(circle at bottom right,rgba(0,255,170,0.07),transparent 30%),
    #020611;

    color:#fff;

    min-height:100vh;

    overflow-x:hidden;
}

/* GRID FUNDO */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

    background-size:45px 45px;

    z-index:-1;
}

.header{
width:100%;
min-height:82px;
padding:0 8%;
display:flex;
align-items:center;
justify-content:space-between;
background:rgba(5,5,5,.75);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(0,255,136,.25);
box-shadow:0 10px 35px rgba(0,0,0,.45);
position:sticky;
top:0;
z-index:999;
}

.logo{
display:flex;
align-items:center;
gap:14px;
cursor:pointer;
transition:.3s ease;
}

.logo:hover{
transform:scale(1.03);
}

.logo img{
width:52px;
height:52px;
padding:9px;
border-radius:18px;
background:linear-gradient(135deg,rgba(0,255,136,.18),rgba(0,132,255,.12));
border:1px solid rgba(0,255,136,.35);
box-shadow:0 0 25px rgba(0,255,136,.18);
}

.logo span,
.logo-text h1{
font-size:25px;
font-weight:800;
color:#00ff88;
letter-spacing:.5px;
}

.logo-text p{
color:rgba(255,255,255,.55);
font-size:12px;
margin-top:2px;
}

.menu{
display:flex;
align-items:center;
gap:12px;
}

.menu a{
color:rgba(255,255,255,.85);
text-decoration:none;
padding:11px 17px;
border-radius:999px;
font-size:14px;
font-weight:700;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
transition:.3s ease;
}

.menu a:hover{
color:#000;
background:#00ff88;
border-color:#00ff88;
box-shadow:0 0 22px rgba(0,255,136,.45);
transform:translateY(-2px);
}

.main-grid{
display:grid;
grid-template-columns:1fr 1fr;
padding:55px 8%;
gap:45px;
align-items:center;
}


/* =========================================================
MAIN
========================================================= */

.main-grid{

    width:100%;

    min-height:calc(100vh - 90px);

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:60px;

    padding:70px 8%;
}

/* =========================================================
HERO
========================================================= */

.hero{

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.tag{

    width:max-content;

    padding:10px 18px;

    border-radius:999px;

    background:rgba(77,163,255,0.12);

    border:1px solid rgba(77,163,255,0.2);

    color:#6eb7ff;

    margin-bottom:30px;
}

.hero h1{

    font-size:4.2rem;

    line-height:1.05;

    margin-bottom:25px;
}

.hero p{

    color:#9fb2cc;

    font-size:1.1rem;

    line-height:1.9;

    max-width:580px;
}

/* IMAGE */

.hero img{

    width:100%;
    max-width:450px;

    margin-top:40px;

    animation:float 4s ease-in-out infinite;

    filter:
    drop-shadow(0 25px 60px rgba(0,0,0,0.5));
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-14px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* =========================================================
FORM
========================================================= */

.form{

    background:rgba(255,255,255,0.03);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border-radius:30px;

    overflow:hidden;

    box-shadow:
    0 30px 80px rgba(0,0,0,0.45);
}

/* TOP */

.form-top{

    padding:28px 30px;

    border-bottom:1px solid rgba(255,255,255,0.06);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.form-top h2{

    font-size:1.8rem;
}

.live{

    padding:8px 14px;

    border-radius:999px;

    background:rgba(0,255,170,0.12);

    color:#00ffae;

    font-size:0.85rem;

    font-weight:700;
}

/* IFRAME */

.speed-frame{

    width:100%;
    height:700px;

    border:none;

    background:#000;
}

/* =========================================================
RESPONSIVO
========================================================= */

@media(max-width:1100px){

    .main-grid{

        grid-template-columns:1fr;
    }

    .hero{

        text-align:center;
        align-items:center;
    }

    .hero p{
        max-width:100%;
    }

}

@media(max-width:700px){

    .header{

        flex-direction:column;

        gap:20px;
    }

    .menu{

        flex-wrap:wrap;
        justify-content:center;
    }

    .hero h1{

        font-size:2.8rem;
    }

    .main-grid{

        padding:50px 5%;
    }

    .speed-frame{

        height:650px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->
    <header class="header">

    <div class="logo" onclick="window.location.href='../home/home.html'">
        <img src="https://cdn-icons-png.flaticon.com/512/906/906175.png" alt="Logo UltraBuscaX">
        
        <div class="logo-text">
            <h1>UltraBuscaX</h1>
            <p>Buscas Inteligentes</p>
        </div>
    </div>

    <nav class="menu">

        <a href="../home/home.html">
            🏠 Home
        </a>
      

        <a href="../suporte/suporte.html">
            📞 Suporte
        </a>

    </nav>

</header>


<!-- MAIN -->

<main class="main-grid">

    <!-- HERO -->

    <div class="hero">

        <div class="tag">
            ⚡ SPEED TEST REAL
        </div>

        <h1>
            Teste sua internet em tempo real
        </h1>

        <p>
            Analise download, upload, ping,
            latência e estabilidade da sua conexão
            utilizando um sistema profissional
            de velocidade online.
        </p>

        <img src="https://cdn-icons-png.flaticon.com/512/4149/4149676.png">

    </div>

    <!-- FORM -->

    <div class="form">

        <div class="form-top">

            <h2>Teste Profissional</h2>

            <div class="live">
                ● AO VIVO
            </div>

        </div>

        <!-- SPEEDTEST REAL -->

        <iframe
        class="speed-frame"
        src="https://www.speedtest.net/pt">
        </iframe>

    </div>

</main>

</body>

</html>
