<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraBuscaX - CPF</title>

    <link rel="stylesheet" href="../css/cpf.css">
</head>

<body>

<header class="header">

    <div class="logo" onclick="window.location.href='../home/home.html'">
        <img src="https://cdn-icons-png.flaticon.com/512/906/906175.png" alt="Logo UltraBuscaX">
        
        <div class="logo-text">
            <h1>UltraBuscaX</h1>
            <p>Buscas Inteligentes</p>
        </div>
    </div>

    <nav class="menu">

        <a href="../home/home.html">
            🏠 Home
        </a>



        <a href="../suporte/suporte.html">
            📞 Suporte
        </a>

    </nav>

</header>
    <main class="main-grid">

        <!-- ESQUERDA -->
        <div class="hero">
            <h1>Consulta Inteligente</h1>
            <p>Busque informações completas de CPF em tempo real com rapidez e segurança.</p>

            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
        </div>

        <!-- DIREITA -->
        <div class="form">

            <h2>Buscar CPF</h2>

            <div class="input-group">
                <span>🔎</span>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="formatarCPF(this)">
            </div>

            <button onclick="consultarCPF()">Buscar Dados</button>

            <div id="loading" class="loading hidden"></div>

            <div id="resultado" class="resultado-box">
                <p class="placeholder">Nenhuma consulta realizada...</p>
            </div>

        </div>

    </main>

    <script>
        function formatarCPF(input) {

            let value = input.value.replace(/\D/g, '');

            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');

            input.value = value;
        }

        async function consultarCPF() {

            const cpf = document.getElementById("cpf").value.replace(/\D/g, '');
            const resultado = document.getElementById("resultado");
            const loading = document.getElementById("loading");

            if (cpf.length !== 11) {
                resultado.innerHTML = "<p>Digite um CPF válido.</p>";
                return;
            }

            loading.classList.remove("hidden");
            resultado.innerHTML = "";

            try {

                const req = await fetch("https://apicpf.com/api/consulta?cpf=" + cpf, {
                    headers: {
                        "X-API-KEY": "54ec96e300e00d578ea3894294e58f657fff03833e1c0e763c27e75bb26a1dd3"
                    }
                });

                const resposta = await req.json();
                const data = resposta.data;

                loading.classList.add("hidden");

                function pegar(...campos) {
                    for (let campo of campos) {
                        if (data[campo]) return data[campo];
                    }
                    return "N/A";
                }

                resultado.innerHTML = `
<div class="grid">

<div><strong>Nome</strong><span>${pegar("nome", "NOME", "nome_completo")}</span></div>

<div><strong>CPF</strong><span>${cpf}</span></div>

<div><strong>Nascimento</strong><span>${pegar("nascimento", "data_nascimento")}</span></div>

<div><strong>Situação</strong><span>${pegar("status", "situacao")}</span></div>

<div><strong>Mãe</strong><span>${pegar("mae", "nome_mae")}</span></div>

<div><strong>Sexo</strong><span>${pegar("sexo", "genero")}</span></div>

<div><strong>Cidade</strong><span>${pegar("cidade", "municipio")}</span></div>

<div><strong>UF</strong><span>${pegar("uf", "estado")}</span></div>

</div>
`;

            } catch (error) {

                loading.classList.add("hidden");
                resultado.innerHTML = "<p>❌ CPF não encontrado ou erro na API.</p>";

            }

        }
    </script>

</body>

</html>
